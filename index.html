<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人 AI 全栈助手 - 终极旗舰版</title>
  <!-- 引入样式与解析库 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* 优化的 Markdown 渲染排版 */
    .markdown-body p { margin-bottom: 0.5rem; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: bold; margin-top: 0.75rem; margin-bottom: 0.25rem; }
    .markdown-body blockquote { border-left: 4px solid #3b82f6; padding-left: 0.75rem; color: #4b5563; margin: 0.5rem 0; }
    .markdown-body code:not(pre code) { background: #fee2e2; color: #ef4444; padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.875em; }
    .markdown-body pre { background: #282c34; border-radius: 0.75rem; margin: 0.75rem 0; position: relative; overflow-x: auto; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

  <!-- 顶部导航栏 -->
  <header class="bg-white border-b border-gray-200 py-3 px-6 flex flex-wrap items-center justify-between shadow-sm gap-3">
    <div class="flex items-center space-x-3">
      <div id="role-avatar" class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">👨‍💻</div>
      <div>
        <h1 class="font-bold text-gray-800 text-base">我的专属 AI 全栈助手</h1>
        <p class="text-xs text-green-600 flex items-center">
          <span class="w-2 h-2 rounded-full bg-green-500 inline-block mr-1"></span>
          已开启：流式打字机 + 代码高亮 + 数据库记忆
        </p>
      </div>
    </div>

    <!-- 角色胶囊 + 清空记忆按钮 -->
    <div class="flex items-center space-x-3">
      <div class="flex items-center space-x-1 bg-gray-100 p-1 rounded-xl text-xs font-medium">
        <button onclick="switchRole('mentor', '👨‍💻', '全栈技术导师')" id="btn-mentor" class="role-btn px-3 py-1.5 rounded-lg bg-white text-blue-600 shadow-sm transition">👨‍💻 技术导师</button>
        <button onclick="switchRole('english', '🗣️', '英语口语私教')" id="btn-english" class="role-btn px-3 py-1.5 rounded-lg text-gray-600 hover:text-gray-900 transition">🗣️ 英语私教</button>
        <button onclick="switchRole('interviewer', '💼', '大厂面试官')" id="btn-interviewer" class="role-btn px-3 py-1.5 rounded-lg text-gray-600 hover:text-gray-900 transition">💼 大厂面试官</button>
        <button onclick="switchRole('roaster', '🎭', '脱口秀大师')" id="btn-roaster" class="role-btn px-3 py-1.5 rounded-lg text-gray-600 hover:text-gray-900 transition">🎭 脱口秀大师</button>
      </div>

      <button onclick="clearChatHistory()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 transition shadow-sm flex items-center space-x-1">
        <span>🗑️ 清空记忆</span>
      </button>
    </div>
  </header>

  <!-- 聊天记录展示区 -->
  <main id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl w-full mx-auto"></main>

  <!-- 底部输入框区域 -->
  <footer class="bg-white border-t border-gray-200 p-4">
    <div class="max-w-4xl mx-auto flex space-x-3">
      <input id="user-input" type="text" placeholder="向你的专属 AI 提问... (按 Enter 发送)" class="flex-1 border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 text-sm" />
      <button id="send-btn" onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-xl transition shadow-sm text-sm">发送</button>
    </div>
  </footer>

  <script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const roleAvatar = document.getElementById("role-avatar");
    let currentRole = "mentor";

    // 配置 Markdown
    marked.setOptions({ breaks: true });

    function switchRole(roleKey, icon, roleName) {
      currentRole = roleKey;
      roleAvatar.innerText = icon;
      document.querySelectorAll(".role-btn").forEach(btn => {
        btn.classList.remove("bg-white", "text-blue-600", "shadow-sm");
        btn.classList.add("text-gray-600");
      });
      const activeBtn = document.getElementById(`btn-${roleKey}`);
      activeBtn.classList.add("bg-white", "text-blue-600", "shadow-sm");
      activeBtn.classList.remove("text-gray-600");
      appendSystemNotice(`已切换为角色：【${roleName}】！`);
    }

    function appendSystemNotice(text) {
      const div = document.createElement("div");
      div.className = "flex justify-center";
      div.innerHTML = `<span class="bg-gray-200 text-gray-600 text-xs px-3 py-1 rounded-full">${text}</span>`;
      chatBox.appendChild(div);
      scrollToBottom();
    }

    // 页面初次加载，加载历史记录并完成代码高亮
    window.onload = async () => {
      try {
        const res = await fetch("/messages");
        const data = await res.json();
        if (data.code === 200) {
          data.data.forEach(msg => appendMessage(msg.role, msg.content, false));
          scrollToBottom();
        }
      } catch (err) { console.error(err); }
    };

    function appendMessage(role, content, shouldScroll = true) {
      const isUser = role === "user";
      const div = document.createElement("div");
      div.className = `flex ${isUser ? "justify-end" : "justify-start"} items-start space-x-2`;

      div.innerHTML = `
        ${!isUser ? `<div class="w-8 h-8 rounded-full bg-blue-600 flex-shrink-0 flex items-center justify-center text-white text-xs font-bold">${roleAvatar.innerText}</div>` : ''}
        <div class="max-w-[80%] rounded-2xl px-5 py-3 shadow-sm ${
          isUser ? "bg-blue-600 text-white rounded-tr-none text-sm" : "bg-white text-gray-800 border border-gray-100 rounded-tl-none markdown-body text-sm"
        }">
          ${isUser ? escapeHtml(content) : marked.parse(content)}
        </div>
        ${isUser ? '<div class="w-8 h-8 rounded-full bg-gray-300 flex-shrink-0 flex items-center justify-center text-gray-700 text-xs font-bold">我</div>' : ''}
      `;

      chatBox.appendChild(div);
      if (!isUser) attachCodeHighlightAndCopy(div);
      if (shouldScroll) scrollToBottom();
      return div;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 代码高亮并自动挂载「一键复制」小按钮
    function attachCodeHighlightAndCopy(container) {
      container.querySelectorAll("pre code").forEach(block => {
        hljs.highlightElement(block);
        const pre = block.parentElement;
        if (!pre.querySelector(".copy-btn")) {
          const btn = document.createElement("button");
          btn.className = "copy-btn absolute top-2 right-2 text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 px-2 py-1 rounded transition";
          btn.innerText = "复制";
          btn.onclick = () => {
            navigator.clipboard.writeText(block.innerText);
            btn.innerText = "已复制! ✓";
            setTimeout(() => { btn.innerText = "复制"; }, 2000);
          };
          pre.appendChild(btn);
        }
      });
    }

    function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }

    // 核心：打字机流式输出交互
    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;

      // 创建一个 AI 回复气泡占位
      const aiBubble = appendMessage("assistant", "...");
      const contentDiv = aiBubble.querySelector(".markdown-body");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: text, persona: currentRole })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let accumulatedText = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          accumulatedText += decoder.decode(value, { stream: true });
          contentDiv.innerHTML = marked.parse(accumulatedText);
          attachCodeHighlightAndCopy(contentDiv);
          scrollToBottom();
        }
      } catch (err) {
        contentDiv.innerText = "网络请求失败：" + err;
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
        scrollToBottom();
      }
    }

    // 清空历史记忆
    async function clearChatHistory() {
      if (!confirm("确定要清空数据库中的历史记忆并开启新对话吗？")) return;
      try {
        await fetch("/messages", { method: "DELETE" });
        chatBox.innerHTML = "";
        appendSystemNotice("✨ 历史记忆已彻底清空，已开启全新的对话！");
      } catch (err) {
        alert("清空失败: " + err);
      }
    }

    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>
