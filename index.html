<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人 AI 全栈助手 - RAG 知识库版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    .markdown-body p { margin-bottom: 0.5rem; }
    .markdown-body p:last-child { margin-bottom: 0; }
    .markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-body ol { list-style-type: decimal; padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: bold; margin-top: 0.75rem; margin-bottom: 0.25rem; }
    .markdown-body blockquote { border-left: 4px solid #3b82f6; padding-left: 0.75rem; color: #4b5563; margin: 0.5rem 0; }
    .markdown-body code:not(pre code) { background: #fee2e2; color: #ef4444; padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.875em; }
    .markdown-body pre { background: #282c34; border-radius: 0.75rem; margin: 0.75rem 0; position: relative; overflow-x: auto; }
    
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    .recording-active { animation: pulse-ring 1.5s infinite; background-color: #ef4444 !important; color: white !important; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">

  <!-- 顶部导航栏 -->
  <header class="bg-white border-b border-gray-200 py-3 px-6 flex flex-wrap items-center justify-between shadow-sm gap-3">
    <div class="flex items-center space-x-3">
      <div id="role-avatar" class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-lg shadow-sm">👨‍💻</div>
      <div>
        <h1 class="font-bold text-gray-800 text-base">我的专属 AI 全栈助手</h1>
        <p class="text-xs text-green-600 flex items-center">
          <span class="w-2 h-2 rounded-full bg-green-500 inline-block mr-1"></span>
          已开启：📚 RAG 外挂知识库 + 🎙️ 语音全栈
        </p>
      </div>
    </div>

    <!-- 知识库状态栏 + 角色组 + 控制按钮 -->
    <div class="flex items-center space-x-2 flex-wrap gap-y-2">
      <!-- PDF 知识库挂载胶囊 -->
      <div id="knowledge-badge" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs bg-gray-100 text-gray-600 border border-gray-200">
        <span id="kb-icon">📄</span>
        <span id="kb-text">知识库未挂载</span>
        <button id="kb-unload-btn" onclick="unloadKnowledge()" class="hidden text-red-500 hover:text-red-700 ml-1 font-bold" title="卸载文档">×</button>
      </div>

      <!-- 上传 PDF 按钮（隐藏真正的 file input） -->
      <input type="file" id="pdf-input" accept=".pdf,.txt,.md" class="hidden" onchange="handleFileUpload(event)" />
      <button onclick="document.getElementById('pdf-input').click()" class="px-3 py-1.5 rounded-xl text-xs font-medium bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 transition shadow-sm flex items-center space-x-1">
        <span>📎 上传 PDF</span>
      </button>

      <!-- 角色组 -->
      <div class="flex items-center space-x-1 bg-gray-100 p-1 rounded-xl text-xs font-medium">
        <button onclick="switchRole('mentor', '👨‍💻', '全栈技术导师')" id="btn-mentor" class="role-btn px-2.5 py-1 rounded-lg bg-white text-blue-600 shadow-sm transition">👨‍💻 导师</button>
        <button onclick="switchRole('english', '🗣️', '英语口语私教')" id="btn-english" class="role-btn px-2.5 py-1 rounded-lg text-gray-600 hover:text-gray-900 transition">🗣️ 英语</button>
        <button onclick="switchRole('interviewer', '💼', '大厂面试官')" id="btn-interviewer" class="role-btn px-2.5 py-1 rounded-lg text-gray-600 hover:text-gray-900 transition">💼 面试官</button>
        <button onclick="switchRole('roaster', '🎭', '脱口秀大师')" id="btn-roaster" class="role-btn px-2.5 py-1 rounded-lg text-gray-600 hover:text-gray-900 transition">🎭 脱口秀</button>
      </div>

      <!-- 自动朗读开关 -->
      <button onclick="toggleAutoSpeech()" id="btn-tts" class="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-blue-50 text-blue-600 border border-blue-200 transition shadow-sm">
        <span id="tts-icon">🔊</span> 朗读:开
      </button>

      <!-- 清空记忆 -->
      <button onclick="clearChatHistory()" class="px-2.5 py-1.5 rounded-xl text-xs font-medium bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 transition shadow-sm">
        🗑️ 清空
      </button>
    </div>
  </header>

  <!-- 聊天记录展示区 -->
  <main id="chat-box" class="flex-1 overflow-y-auto p-6 space-y-4 max-w-4xl w-full mx-auto"></main>

  <!-- 底部输入框区域 -->
  <footer class="bg-white border-t border-gray-200 p-4">
    <div class="max-w-4xl mx-auto flex space-x-2 items-center">
      <button id="mic-btn" onclick="toggleSpeechRecognition()" title="点击开始/结束语音输入" class="w-12 h-12 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 flex items-center justify-center transition shadow-sm text-xl flex-shrink-0">
        🎙️
      </button>
      <input id="user-input" type="text" placeholder="向你的专属 AI 提问... (支持知识库开卷问答与语音)" class="flex-1 border border-gray-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 text-gray-800 text-sm h-12" />
      <button id="send-btn" onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 h-12 rounded-xl transition shadow-sm text-sm flex-shrink-0">发送</button>
    </div>
  </footer>

  <script>
    const chatBox = document.getElementById("chat-box");
    const userInput = document.getElementById("user-input");
    const sendBtn = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");
    const roleAvatar = document.getElementById("role-avatar");
    let currentRole = "mentor";
    let autoSpeechEnabled = true;

    // ========== RAG 知识库上传与状态管理 ==========
    async function checkKnowledgeStatus() {
      try {
        const res = await fetch("/knowledge/status");
        const data = await res.json();
        const badge = document.getElementById("knowledge-badge");
        const kbText = document.getElementById("kb-text");
        const unloadBtn = document.getElementById("kb-unload-btn");

        if (data.loaded) {
          badge.className = "flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs bg-emerald-50 text-emerald-800 border border-emerald-300 font-medium";
          kbText.innerText = `已挂载: ${data.filename} (${data.chunks}段知识)`;
          unloadBtn.classList.remove("hidden");
        } else {
          badge.className = "flex items-center space-x-1.5 px-3 py-1.5 rounded-xl text-xs bg-gray-100 text-gray-600 border border-gray-200";
          kbText.innerText = "知识库未挂载";
          unloadBtn.classList.add("hidden");
        }
      } catch (e) { console.error(e); }
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      appendSystemNotice(`⏳ 正在解析并切分《${file.name}》，请稍候...`);

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch("/upload_pdf", { method: "POST", body: formData });
        const data = await res.json();
        if (data.code === 200) {
          appendSystemNotice(`🎉 成功挂载《${data.filename}》！共拆解为 ${data.total_chunks} 张知识卡片，现在你可以针对该文档自由提问了！`);
          checkKnowledgeStatus();
        } else {
          appendSystemNotice(`❌ 上传失败: ${JSON.stringify(data)}`);
        }
      } catch (err) {
        appendSystemNotice(`❌ 上传出错: ${err}`);
      } finally {
        event.target.value = "";
      }
    }

    async function unloadKnowledge() {
      if (!confirm("确定要卸载当前 PDF 知识库吗？")) return;
      await fetch("/knowledge", { method: "DELETE" });
      checkKnowledgeStatus();
      appendSystemNotice("ℹ️ 知识库已卸载，大模型恢复为通用问答模式。");
    }

    // ========== 语音模块 ==========
    function toggleAutoSpeech() {
      autoSpeechEnabled = !autoSpeechEnabled;
      document.getElementById("tts-icon").innerText = autoSpeechEnabled ? "🔊" : "🔇";
      const btn = document.getElementById("btn-tts");
      btn.innerText = autoSpeechEnabled ? "🔊 朗读:开" : "🔇 朗读:关";
      if (!autoSpeechEnabled) window.speechSynthesis.cancel();
    }

    function cleanMarkdownForSpeech(text) {
      return text.replace(/```[\s\S]*?```/g, "代码片段请看屏幕。").replace(/[*#_~`>]/g, "").trim();
    }

    function speakText(rawText) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const clean = cleanMarkdownForSpeech(rawText);
      if (!clean) return;
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = currentRole === "english" ? "en-US" : "zh-CN";
      u.rate = 1.05;
      window.speechSynthesis.speak(u);
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.onstart = () => { isRecording = true; micBtn.classList.add("recording-active"); };
      recognition.onresult = (e) => {
        let t = ""; for (let i = e.resultIndex; i < e.results.length; ++i) t += e.results[i][0].transcript;
        userInput.value = t;
      };
      recognition.onerror = () => stopRecording();
      recognition.onend = () => stopRecording();
    }
    function toggleSpeechRecognition() {
      if (!recognition) return alert("浏览器不支持语音");
      if (isRecording) { recognition.stop(); stopRecording(); }
      else { recognition.lang = currentRole === "english" ? "en-US" : "zh-CN"; window.speechSynthesis.cancel(); recognition.start(); }
    }
    function stopRecording() { isRecording = false; micBtn.classList.remove("recording-active"); }

    // ========== 基础交互与流式聊天 ==========
    marked.setOptions({ breaks: true });
    function switchRole(roleKey, icon, roleName) {
      currentRole = roleKey; roleAvatar.innerText = icon; window.speechSynthesis.cancel();
      document.querySelectorAll(".role-btn").forEach(b => { b.classList.remove("bg-white", "text-blue-600", "shadow-sm"); b.classList.add("text-gray-600"); });
      const ab = document.getElementById(`btn-${roleKey}`);
      ab.classList.add("bg-white", "text-blue-600", "shadow-sm"); ab.classList.remove("text-gray-600");
      appendSystemNotice(`已切换为角色：【${roleName}】！`);
    }

    function appendSystemNotice(text) {
      const div = document.createElement("div"); div.className = "flex justify-center";
      div.innerHTML = `<span class="bg-gray-200 text-gray-700 text-xs px-3 py-1 rounded-full shadow-sm">${text}</span>`;
      chatBox.appendChild(div); scrollToBottom();
    }

    window.onload = async () => {
      checkKnowledgeStatus();
      try {
        const res = await fetch("/messages");
        const data = await res.json();
        if (data.code === 200) data.data.forEach(m => appendMessage(m.role, m.content, false));
        scrollToBottom();
      } catch (e) {}
    };

    function appendMessage(role, content, shouldScroll = true) {
      const isUser = role === "user";
      const div = document.createElement("div");
      div.className = `flex ${isUser ? "justify-end" : "justify-start"} items-start space-x-2`;
      div.innerHTML = `
        ${!isUser ? `<div class="w-8 h-8 rounded-full bg-blue-600 flex-shrink-0 flex items-center justify-center text-white text-xs font-bold">${roleAvatar.innerText}</div>` : ''}
        <div class="max-w-[80%] rounded-2xl px-5 py-3 shadow-sm ${isUser ? "bg-blue-600 text-white rounded-tr-none text-sm" : "bg-white text-gray-800 border border-gray-100 rounded-tl-none markdown-body text-sm relative group"}">
          ${isUser ? escapeHtml(content) : marked.parse(content)}
          ${!isUser ? `<button onclick="speakText(this.parentElement.innerText)" class="mt-2 text-xs text-gray-400 hover:text-blue-600 transition flex items-center space-x-1"><span>🔊 朗读</span></button>` : ''}
        </div>
        ${isUser ? '<div class="w-8 h-8 rounded-full bg-gray-300 flex-shrink-0 flex items-center justify-center text-gray-700 text-xs font-bold">我</div>' : ''}
      `;
      chatBox.appendChild(div);
      if (!isUser) attachCodeHighlightAndCopy(div);
      if (shouldScroll) scrollToBottom();
      return div;
    }

    function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function attachCodeHighlightAndCopy(container) {
      container.querySelectorAll("pre code").forEach(block => {
        hljs.highlightElement(block);
        const pre = block.parentElement;
        if (!pre.querySelector(".copy-btn")) {
          const btn = document.createElement("button");
          btn.className = "copy-btn absolute top-2 right-2 text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 px-2 py-1 rounded transition";
          btn.innerText = "复制";
          btn.onclick = () => { navigator.clipboard.writeText(block.innerText); btn.innerText = "已复制! ✓"; setTimeout(() => btn.innerText = "复制", 2000); };
          pre.appendChild(btn);
        }
      });
    }

    function scrollToBottom() { chatBox.scrollTop = chatBox.scrollHeight; }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;
      if (isRecording) { recognition.stop(); stopRecording(); }

      appendMessage("user", text);
      userInput.value = ""; userInput.disabled = true; sendBtn.disabled = true;

      const aiBubble = appendMessage("assistant", "...");
      const contentDiv = aiBubble.querySelector(".markdown-body");

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: text, persona: currentRole })
        });
        const reader = response.body.getReader();
        const decoder = new TextDecoder("utf-8");
        let accumulatedText = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          accumulatedText += decoder.decode(value, { stream: true });
          contentDiv.innerHTML = marked.parse(accumulatedText) + `<button onclick="speakText(this.parentElement.innerText)" class="mt-2 text-xs text-gray-400 hover:text-blue-600 transition flex items-center space-x-1"><span>🔊 朗读</span></button>`;
          attachCodeHighlightAndCopy(contentDiv);
          scrollToBottom();
        }
        if (autoSpeechEnabled && accumulatedText) speakText(accumulatedText);
      } catch (err) {
        contentDiv.innerText = "网络请求失败：" + err;
      } finally {
        userInput.disabled = false; sendBtn.disabled = false; userInput.focus(); scrollToBottom();
      }
    }

    async function clearChatHistory() {
      if (!confirm("确定要清空数据库中的历史记忆吗？")) return;
      window.speechSynthesis.cancel();
      await fetch("/messages", { method: "DELETE" });
      chatBox.innerHTML = "";
      appendSystemNotice("✨ 历史记忆已清空！");
    }

    userInput.addEventListener("keypress", (e) => { if (e.key === "Enter") sendMessage(); });
  </script>
</body>
</html>
